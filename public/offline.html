<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — The Meridian Brief</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ea; color: #181511; font-family: Georgia, 'Times New Roman', serif; }
    main { max-width: 30rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .75rem; }
    p { line-height: 1.55; color: #4a443a; }
    a, button { display: inline-block; margin-top: 1rem; padding: .6rem 1.1rem; background: #181511; color: #fffdf6; border: 0; font: 600 .9rem system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>The Meridian Brief can't reach the wire right now. Pages and stories you opened recently are still available from this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/">Front page</a>
  </main>
</body>
</html>

name: Midnight resume (continue unfinished work)

# Runs after your Claude limits reset at midnight IST and continues any
# development that was left mid-way. It looks at three sources of "unfinished
# work":
#   1. Unchecked tasks in .claude/pending-work.md
#   2. Open issues labelled "auto"
#   3. Open *draft* pull requests
# If none of them have anything pending, the run exits quietly ("if not then ok").
#
# Auth: it uses your Claude *subscription* via CLAUDE_CODE_OAUTH_TOKEN, which is
# exactly the quota that resets at midnight — so it does not spend API credits.
# Set it up once:  run `claude setup-token` locally, then add the value as a
# repo secret named CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets → Actions).

on:
  schedule:
    # 21:30 UTC = 03:00 IST — comfortably after the midnight reset has landed.
    # GitHub cron is always UTC. Adjust if your reset time differs.
    - cron: "30 21 * * *"
  workflow_dispatch:
    # Lets you trigger a run by hand from the Actions tab to test it.
    inputs:
      force:
        description: "Run Claude even if no pending work is detected"
        type: boolean
        default: false

# Don't pile up overlapping overnight runs.
concurrency:
  group: midnight-resume
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather unfinished work
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          CTX=".claude/automation/work-context.md"
          mkdir -p .claude/automation
          : > "$CTX"

          had_work=0

          # ---- 1. Queue file: unchecked "- [ ]" tasks --------------------
          QUEUE=".claude/pending-work.md"
          if [ -f "$QUEUE" ] && grep -qE '^[[:space:]]*-[[:space:]]\[ \]' "$QUEUE"; then
            had_work=1
            {
              echo "## Source 1 — queue file ($QUEUE)"
              echo
              echo "Unchecked tasks (work these top-to-bottom):"
              echo '```'
              grep -nE '^[[:space:]]*-[[:space:]]\[ \]' "$QUEUE" || true
              echo '```'
              echo
            } >> "$CTX"
          fi

          # ---- 2. Open issues labelled "auto" ----------------------------
          ISSUES="$(gh issue list --state open --label auto \
                      --json number,title,url --jq 'length' 2>/dev/null || echo 0)"
          if [ "${ISSUES:-0}" -gt 0 ]; then
            had_work=1
            {
              echo "## Source 2 — open issues labelled \"auto\""
              echo
              gh issue list --state open --label auto \
                --json number,title,url \
                --jq '.[] | "- #\(.number) \(.title) — \(.url)"'
              echo
            } >> "$CTX"
          fi

          # ---- 3. Open draft PRs -----------------------------------------
          DRAFTS="$(gh pr list --state open \
                      --json number,title,url,isDraft,headRefName \
                      --jq '[.[] | select(.isDraft)] | length' 2>/dev/null || echo 0)"
          if [ "${DRAFTS:-0}" -gt 0 ]; then
            had_work=1
            {
              echo "## Source 3 — open draft pull requests"
              echo
              gh pr list --state open \
                --json number,title,url,isDraft,headRefName \
                --jq '.[] | select(.isDraft) | "- PR #\(.number) \(.title) (branch: \(.headRefName)) — \(.url)"'
              echo
            } >> "$CTX"
          fi

          if [ "$FORCE" = "true" ]; then
            had_work=1
          fi

          if [ "$had_work" = "1" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "Pending work detected. Context:"
            cat "$CTX"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "No unfinished work in any source — nothing to do. Exiting cleanly."
          fi

      - name: Set up Node
        if: steps.gather.outputs.has_work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        if: steps.gather.outputs.has_work == 'true'
        run: npm ci || npm install

      - name: Install Claude Code CLI
        if: steps.gather.outputs.has_work == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity for Claude commits
        if: steps.gather.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "midnight-resume[bot]"
          git config user.email "midnight-resume[bot]@users.noreply.github.com"
          # Make sure the report label exists so the agent can label its issue.
          gh label create midnight-report --color 0E8A16 \
            --description "Overnight midnight-resume run reports" 2>/dev/null || true

      - name: Run Claude to continue the work
        id: claude
        if: steps.gather.outputs.has_work == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Defensive: GitHub secrets sometimes get pasted with a stray newline
          # or surrounding whitespace, which makes an invalid HTTP auth header.
          # OAuth tokens never contain whitespace, so it is safe to strip it.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          set +e
          claude --dangerously-skip-permissions \
            --model claude-fable-5 \
            --max-turns 60 \
            -p "You are running unattended, overnight, in CI. Your job is to pick up
          development that was left unfinished and push it forward safely, then
          report what happened as a GitHub issue.

          The list of unfinished work for tonight is in
          \`.claude/automation/work-context.md\` — read it first.

          Then, working through the items it lists:

          1. Queue tasks (\`.claude/pending-work.md\`): do the unchecked \`- [ ]\`
             tasks top-to-bottom, as MANY as you can finish well within your turn
             budget. When a task is finished, change its \`- [ ]\` to \`- [x]\`
             and append a one-line note under it describing what you did. It is
             better to fully finish a few chunks than to half-do many — if the
             next chunk is too big to finish cleanly, STOP there and leave it
             unchecked rather than pushing broken work.
          2. Issues labelled 'auto': implement what the issue asks. Reference
             the issue number in your commit so it links up.
          3. Draft PRs: check out that PR's branch, finish what's incomplete,
             and push to the SAME branch so the existing PR updates.

          Environment constraints (work within these; do NOT fail the run over them):
          - You CANNOT create a new GitHub repo or deploy to Vercel from here
            (the token is scoped to this repo only and there is no Vercel login).
            Build each new app in-repo under \`apps/<name>/\` as the tasks say,
            and record repo-creation / Vercel-deploy as 'action needed' items.
          - You CANNOT reach Google Drive or external images. Where a task needs
            them, build the structure/templates with placeholder content and flag
            it as 'action needed'.

          Rules:
          - Work on a branch, never commit straight to main. For queue/issue
            work, create or reuse a branch named \`auto/midnight-resume\`.
          - After changing code, run the relevant build (root \`npm run build\`,
            or \`npm run build\` inside the sub-app you touched) and lint. Do not
            push changes that break the build — if you cannot get it green, leave
            the task unchecked and write a note in \`.claude/pending-work.md\`.
          - Commit with clear messages and push your branch.
          - Push each completed chunk to \`auto/midnight-resume\` AS YOU GO, so
            progress survives even if you run out of turns mid-way through a later
            chunk. Do NOT wait until the end to push.
          - You do NOT need to open a pull request or post a report issue — a
            later automated workflow step does both reliably. Spend your turns on
            the actual work.
          - Keep changes focused on the requested tasks; no large unrelated
            refactors. If a task is ambiguous or risky, skip it and leave a note.
          - Do NOT commit \`.claude/automation/work-context.md\` (git-ignored)." 2>&1 | tee "$RUNNER_TEMP/claude.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && grep -q "Reached max turns" "$RUNNER_TEMP/claude.log"; then
            echo "Claude hit the turn limit — partial progress is expected and was pushed per-chunk. Not failing the job."
            exit 0
          fi
          exit $code

      - name: Open draft PR and post the run report
        # Runs no matter how the Claude step ended (finished, hit the turn limit,
        # or errored) so you always get an accurate report and a PR for whatever
        # was pushed. The agent pushes per-chunk, so progress is on the branch
        # even when it runs out of turns.
        if: always() && steps.gather.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          git fetch origin auto/midnight-resume main 2>/dev/null || true
          AHEAD=$(git rev-list --count origin/main..origin/auto/midnight-resume 2>/dev/null || echo 0)

          # Open a draft PR for the work branch if it has commits and no open PR yet.
          PR_URL=""
          if [ "${AHEAD:-0}" -gt 0 ]; then
            PR_URL=$(gh pr list --head auto/midnight-resume --state open --json url --jq '.[0].url // ""' 2>/dev/null || echo "")
            if [ -z "$PR_URL" ]; then
              PR_URL=$(gh pr create --draft --base main --head auto/midnight-resume \
                --title "Overnight work — $(date -u +%Y-%m-%d)" \
                --body "Automated overnight progress from the midnight-resume agent. See the linked report issue and run: $RUN_URL" 2>/dev/null || echo "")
            fi
          fi

          # Read the queue as the agent left it on the work branch (fallback: local copy).
          git show origin/auto/midnight-resume:.claude/pending-work.md > "$RUNNER_TEMP/queue.md" 2>/dev/null \
            || cp .claude/pending-work.md "$RUNNER_TEMP/queue.md"
          DONE=$(grep -c '^- \[x\]' "$RUNNER_TEMP/queue.md" || true)
          LEFT=$(grep -c '^- \[ \]' "$RUNNER_TEMP/queue.md" || true)

          {
            echo "Automated report from the midnight-resume run."
            echo
            echo "- Run: $RUN_URL"
            [ -n "$PR_URL" ] && echo "- Draft PR: $PR_URL"
            echo "- Claude step outcome: \`${CLAUDE_OUTCOME:-unknown}\` (a turn-limit stop is reported as success — partial progress is normal)"
            echo "- New commits pushed to \`auto/midnight-resume\`: ${AHEAD:-0}"
            echo
            echo "## Done this run (${DONE:-0} ticked)"
            grep '^- \[x\]' "$RUNNER_TEMP/queue.md" | sed 's/^- \[x\] /- /' || echo "- none"
            echo
            echo "## Still remaining (${LEFT:-0} left)"
            grep '^- \[ \]' "$RUNNER_TEMP/queue.md" | sed 's/^- \[ \] /- /' || echo "- none — queue is clear"
            echo
            echo "## Action needed from you"
            echo "- Review and (if happy) merge the draft PR above."
            echo "- For the apps to live standalone: create a GitHub repo + connect Vercel (CI can't do either)."
            echo "- Gmail/Google sync needs Google OAuth credentials; AI assist needs a Google AI Studio API key; the grade-11 notes need Google Drive access — provide these when you want those chunks finished."
            echo "- If the outcome above is \`failure\` AND 0 commits landed, the run errored early — check the run log."
          } > "$RUNNER_TEMP/report.md"

          gh issue create --label midnight-report \
            --title "Midnight resume report — $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/report.md" || true
